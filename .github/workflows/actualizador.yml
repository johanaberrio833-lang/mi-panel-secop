name: Actualización Diaria SECOP

on:
  schedule:
    - cron: '0 5 * * *' # Se ejecuta todos los días a las 5:00 AM
  workflow_dispatch: # Nos permite el botón de ejecución manual

jobs:
  actualizar_datos:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de descarga
        run: python scripts/descargar_datos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/datos_hoy.json
          git commit -m "Actualización diaria de datos SECOP" || echo "No hay cambios nuevos"
          git pull --rebase
          git push
