name: Actualización Diaria SECOP

on:
  schedule:
    # Se ejecuta a las 06:00 UTC todos los días (01:00 AM hora Colombia)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente con un botón

jobs:
  actualizar_datos:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de descarga
      run: python scripts/descargar_datos.py

    - name: Guardar cambios en el repositorio (Commit & Push)
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add data/datos_hoy.json
        # Solo hace commit si el archivo cambió
        git diff --quiet && git diff --staged --quiet || git commit -m "Actualización diaria de datos SECOP"
        git push