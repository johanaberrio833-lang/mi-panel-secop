<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Contratos SECOP II</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .filtros {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap; /* Permite que se adapte en celulares */
            gap: 15px;
        }
        .grupo-filtro {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 15px;
            min-width: 200px;
        }
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            max-height: 600px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn-enlace {
            background-color: #2ecc71;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
        }
        .btn-enlace:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Mi Panel Automatizado SECOP II</h1>
        
        <!-- Barra de Filtros Combinados -->
        <div class="filtros">
            <div class="grupo-filtro">
                <label for="filtro-departamento"><strong>Departamento:</strong></label>
                <select id="filtro-departamento">
                    <option value="Todos">Todos</option>
                </select>
            </div>
            
            <div class="grupo-filtro">
                <label for="filtro-modalidad"><strong>Modalidad:</strong></label>
                <select id="filtro-modalidad">
                    <option value="Todas">Todas</option>
                </select>
            </div>

            <span id="contador-procesos" style="margin-left: auto; font-weight: bold; color: #3498db;"></span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Entidad</th>
                        <th>Departamento</th>
                        <th>Objeto del Contrato</th>
                        <th>Modalidad</th>
                        <th>Precio Base</th>
                        <th>Enlace</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="6" style="text-align: center;">Cargando datos de SECOP...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
